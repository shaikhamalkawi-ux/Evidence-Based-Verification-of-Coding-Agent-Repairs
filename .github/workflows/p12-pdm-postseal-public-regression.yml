name: P12 post-seal public PDM update regression suite (NOT A GATE OR ORACLE)

on:
  push:
    paths:
      - .github/workflows/p12-pdm-postseal-public-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-pdm-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_SHA: "564d09acbf2c8ef6500a3864f1fa1d38b3c5cdd5"
      CANDIDATE_SHA: "5c5ea31661c70a7bd7ec7b661f32f380b45c1d40"
      PATCH_SHA256: "53c79ba925902cfd39739be353686dd7970dc683e5716afa79b8638e974552e9"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout frozen pre-oracle decision and public test recipe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify independent P9 decision seal first; do not read future outcomes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('pilot/pdm')
          s=json.loads((root/'locked/P9_DECISION_SEAL.json').read_text())
          d=(root/'locked/P9_DECISIONS_SEALED.jsonl').read_bytes()
          assert hashlib.sha256(d).hexdigest()==s['decisions_sha256']
          assert s['decisions_sha256']=='bc51ef445bc321854288d882677b42c416d7d6584b55a51854d79c40a36b3503'
          print("POST_SEAL_DIAGNOSTIC_ONLY: cannot alter already frozen decision")
          PY
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get exact PDM historical source and locked package compatibility stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p12_postseal_diagnostic
          git init "$RUNNER_TEMP/pdm_base"
          git -C "$RUNNER_TEMP/pdm_base" remote add origin https://github.com/pdm-project/pdm.git
          git -C "$RUNNER_TEMP/pdm_base" fetch --depth 1 origin "$BASE_SHA"
          git -C "$RUNNER_TEMP/pdm_base" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/pdm_base" rev-parse HEAD)" = "$BASE_SHA"
          python3 -m pip install -e "$RUNNER_TEMP/pdm_base[pytest]"
          python3 -m pip install "hishel==0.0.33" "pytest==8.3.3" "pytest-mock==3.14.0" "dep-logic==0.4.11" "resolvelib==1.1.0" "tomlkit==0.13.2" "rich==13.9.2" "httpx==0.27.2" "httpcore==1.0.6" "unearth==0.17.2" "findpython==0.6.2" "pbs-installer==2025.2.12" "virtualenv==20.27.0" "packaging==24.1"
          python3 -m pip uninstall -y httpcore2 httpx2
          python3 -m pip check
          python3 -m pip freeze > p12_postseal_diagnostic/python_environment.txt
      - name: Execute pre-existing PUBLIC update regression suite on original base (post-seal)
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cd "$RUNNER_TEMP/pdm_base"
          python3 -m pytest tests/cli/test_update.py -q -ra \
            > "$GITHUB_WORKSPACE/p12_postseal_diagnostic/base_existing_update_tests.log" 2>&1
          rc=$?
          printf '%s\n' "$rc" > "$GITHUB_WORKSPACE/p12_postseal_diagnostic/base_existing_update_exit_code.txt"
          tail -n 55 "$GITHUB_WORKSPACE/p12_postseal_diagnostic/base_existing_update_tests.log"
          echo "POSTSEAL_BASE_EXISTING_TEST_EXIT=$rc"
          exit 0
      - name: Apply exact already-sealed candidate without changing policy
        shell: bash
        run: |
          set -euo pipefail
          python3 pilot/pdm/ai_candidate_initial.py --repo "$RUNNER_TEMP/pdm_base"
          git -C "$RUNNER_TEMP/pdm_base" diff -- src/pdm/cli/commands/update.py > p12_postseal_diagnostic/agent_patch.diff
          test "$(sha256sum p12_postseal_diagnostic/agent_patch.diff | cut -d' ' -f1)" = "$PATCH_SHA256"
          export GIT_AUTHOR_DATE="2026-11-18T04:10:00Z"
          export GIT_COMMITTER_DATE="2026-11-18T04:10:00Z"
          git -C "$RUNNER_TEMP/pdm_base" add src/pdm/cli/commands/update.py
          git -C "$RUNNER_TEMP/pdm_base" -c user.name="GPT-6 research-generated candidate (unattested)" -c user.email="ai-research@example.invalid" commit -m "GPT-6 P12 initial: include ancestor group provenance during update"
          test "$(git -C "$RUNNER_TEMP/pdm_base" rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Execute same existing PUBLIC update suite on exact frozen candidate
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cd "$RUNNER_TEMP/pdm_base"
          python3 -m pytest tests/cli/test_update.py -q -ra \
            > "$GITHUB_WORKSPACE/p12_postseal_diagnostic/candidate_existing_update_tests.log" 2>&1
          rc=$?
          printf '%s\n' "$rc" > "$GITHUB_WORKSPACE/p12_postseal_diagnostic/candidate_existing_update_exit_code.txt"
          tail -n 65 "$GITHUB_WORKSPACE/p12_postseal_diagnostic/candidate_existing_update_tests.log"
          echo "POSTSEAL_CANDIDATE_EXISTING_TEST_EXIT=$rc"
          exit 0
      - name: Save historical public suite outputs distinct from gate and hidden oracle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p12-pdm-postseal-public-suite
          path: p12_postseal_diagnostic/
          retention-days: 60
          if-no-files-found: warn
