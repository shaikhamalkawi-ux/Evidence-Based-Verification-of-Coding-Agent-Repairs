name: P14 Matplotlib stage-2 scripted corrective feedback (VISIBLE ONLY)

on:
  push:
    paths: ['.github/workflows/p14-matplotlib-second-visible.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visible-second:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      INSTANCE_ID: matplotlib__matplotlib-28933
      BASE_SHA: cf84d9a6410dec07f57916905c9f54bf00d22b2e
      FIRST_SHA: ad65fe2531ce297d5770257370b469b80731a614
      FIRST_PATCH_SHA256: 38d8adc4b7de66735b1318afde6e6e38b0b1bd3f6508157634f11407d7ce6050
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout source, visible tests, authentic stage-1 failure and synthetic feedback
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify script feedback based only on first visible failure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p14_second
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          reg=json.loads(pathlib.Path('pilot/matplotlib/P14_PREREGISTRATION_20261119.json').read_text())
          fb=json.loads(pathlib.Path('pilot/matplotlib/P14_SCRIPTED_FEEDBACK_AFTER_FIRST.json').read_text())
          frame=json.loads(pathlib.Path('pilot/frozen_task_frame_20261117.json').read_text())
          assert frame['selected'][2]['instance_id']==reg['task']['instance_id']==os.environ['INSTANCE_ID']
          assert reg['task']['base_commit']==os.environ['BASE_SHA']
          assert fb['synthetic_not_human'] is True and fb['before_hidden_oracle'] is True
          assert fb['observed_before_feedback']['first_visible_run_id']==44592478321
          assert fb['observed_before_feedback']['first_candidate_sha']==os.environ['FIRST_SHA']
          assert fb['observed_before_feedback']['first_patch_sha256']==os.environ['FIRST_PATCH_SHA256']
          assert fb['observed_before_feedback']['first_patch']['failed']==1
          assert fb['observed_before_feedback']['failing_test'].endswith('test_xy_keyword_signature_for_each_setter')
          testsha=hashlib.sha256(pathlib.Path('pilot/matplotlib/visible_tests.py').read_bytes()).hexdigest()
          assert testsha==fb['observed_before_feedback']['frozen_visible_test_file_sha256']
          print('P14_FEEDBACK=SIMULATED_AFTER_ONE_OBSERVED_VISIBLE_FAILURE')
          print('P14_UNTOUCHED_HIDDEN_ORACLE=TRUE')
          PY
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact historical upstream and install persistent build toolchain
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/mpl_src"
          git -C "$RUNNER_TEMP/mpl_src" remote add origin https://github.com/matplotlib/matplotlib.git
          git -C "$RUNNER_TEMP/mpl_src" fetch --depth 1 origin "$BASE_SHA"
          git -C "$RUNNER_TEMP/mpl_src" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mpl_src" rev-parse HEAD)" = "$BASE_SHA"
          git -C "$RUNNER_TEMP/mpl_src" hash-object lib/matplotlib/lines.py | grep -Fx 9629a821368cc66ddf98f31371ef7c0672642ead
          python3 -m pip install -U pip setuptools wheel \
            'numpy>=2,<2.3' 'pybind11>=2.6,!=2.13.3' 'meson-python>=0.13.1' \
            'setuptools_scm>=7' ninja meson 'pytest>=8,<9' > p14_second/bootstrap.log 2>&1
          python3 -m pip install --no-build-isolation -e "$RUNNER_TEMP/mpl_src" \
            > p14_second/install.log 2>&1 || { tail -n 140 p14_second/install.log; exit 1; }
          python3 -m pip check > p14_second/pip_check.txt 2>&1
          python3 -m pip freeze > p14_second/environment.txt
      - name: Replay authentic first candidate SHA without reading future results
        shell: bash
        run: |
          set -euo pipefail
          python3 pilot/matplotlib/ai_candidate_initial.py --repo "$RUNNER_TEMP/mpl_src"
          git -C "$RUNNER_TEMP/mpl_src" diff -- lib/matplotlib/lines.py > p14_second/first_patch.diff
          test "$(sha256sum p14_second/first_patch.diff | awk '{print $1}')" = "$FIRST_PATCH_SHA256"
          export GIT_AUTHOR_DATE="2026-11-18T02:00:00Z"
          export GIT_COMMITTER_DATE="2026-11-18T02:00:00Z"
          git -C "$RUNNER_TEMP/mpl_src" add lib/matplotlib/lines.py
          git -C "$RUNNER_TEMP/mpl_src" -c user.name="GPT-6 research candidate (unattested)" \
            -c user.email="ai-research@example.invalid" commit -m "P14 first attempt: accept pair or two separate coordinates"
          test "$(git -C "$RUNNER_TEMP/mpl_src" rev-parse HEAD)" = "$FIRST_SHA"
          echo "P14_ORIGINAL_FIRST_SHA_PRESERVED"
      - name: Apply ONE synthetic developer-style correction after genuine visible failure
        shell: bash
        run: |
          set -euo pipefail
          python3 pilot/matplotlib/ai_candidate_after_feedback.py --repo "$RUNNER_TEMP/mpl_src"
          git -C "$RUNNER_TEMP/mpl_src" diff -- lib/matplotlib/lines.py > p14_second/stage2_incremental.diff
          test -s p14_second/stage2_incremental.diff
          export GIT_AUTHOR_DATE="2026-11-18T02:01:00Z"
          export GIT_COMMITTER_DATE="2026-11-18T02:01:00Z"
          git -C "$RUNNER_TEMP/mpl_src" add lib/matplotlib/lines.py
          git -C "$RUNNER_TEMP/mpl_src" -c user.name="GPT-6 research candidate (unattested)" \
            -c user.email="ai-research@example.invalid" commit -m "P14 stage-2: support named xy coordinate and preserve old positional calls"
          git -C "$RUNNER_TEMP/mpl_src" rev-parse HEAD > p14_second/final_sha.txt
          git -C "$RUNNER_TEMP/mpl_src" diff "$BASE_SHA" HEAD -- lib/matplotlib/lines.py > p14_second/stage2_complete_from_base.diff
          test -s p14_second/stage2_complete_from_base.diff
          sha256sum p14_second/stage2_complete_from_base.diff \
            p14_second/stage2_incremental.diff pilot/matplotlib/visible_tests.py \
            pilot/matplotlib/ai_candidate_after_feedback.py > p14_second/sha256.txt
          echo "P14_SECOND_SHA=$(cat p14_second/final_sha.txt)"
          echo "P14_SCRIPTED_CORRECTION_APPLIED_AND_REAL_HUMAN_FEEDBACK=FALSE"
      - name: Run unchanged six preregistered visible tests on second patch
        shell: bash
        run: |
          set +e
          date -u '+%Y-%m-%dT%H:%M:%SZ' > p14_second/test_started_at.txt
          python3 -m pytest pilot/matplotlib/visible_tests.py -q -ra \
            --junitxml=p14_second/final_junit.xml \
            > p14_second/final_visible.log 2>&1
          rc=$?
          date -u '+%Y-%m-%dT%H:%M:%SZ' > p14_second/test_finished_at.txt
          printf '%s\n' "$rc" > p14_second/final_exit.txt
          tail -n 150 p14_second/final_visible.log
          echo "P14_SECOND_VISIBLE_EXIT=$rc; UNREVEALED_OFFICIAL_ORACLE"
          exit 0
      - name: Publish exact source and visible-only evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,xml.etree.ElementTree as ET,os
          p=pathlib.Path('p14_second')
          j=ET.parse(p/'final_junit.xml').getroot()
          s=j if j.tag=='testsuite' else j.find('.//testsuite')
          assert s is not None
          total=int(s.attrib.get('tests',0))
          failed=int(s.attrib.get('failures',0))
          err=int(s.attrib.get('errors',0))
          skipped=int(s.attrib.get('skipped',0))
          obj={'episode_id':os.environ['INSTANCE_ID']+'__STAGE2_SYNTHETIC_FEEDBACK',
               'base_sha':os.environ['BASE_SHA'],
               'first_sha':os.environ['FIRST_SHA'],
               'head_sha':(p/'final_sha.txt').read_text().strip(),
               'complete_patch_sha256':hashlib.sha256((p/'stage2_complete_from_base.diff').read_bytes()).hexdigest(),
               'first_patch_sha256':os.environ['FIRST_PATCH_SHA256'],
               'visible_tests_sha256':hashlib.sha256(pathlib.Path('pilot/matplotlib/visible_tests.py').read_bytes()).hexdigest(),
               'tests_executed':total,'passed':total-failed-err-skipped,
               'failed':failed,'errors':err,'skipped':skipped,
               'visible_exit_code':int((p/'final_exit.txt').read_text()),
               'completed_at_utc':(p/'test_finished_at.txt').read_text().strip(),
               'scripted_feedback':True,'real_human_feedback':False,
               'independent_agent_author_attestation':False,
               'hidden_oracle_seen':False}
          (p/'stage2_visible_receipt.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
          print('P14_SECOND_VISIBLE_RECEIPT '+json.dumps(obj,sort_keys=True))
          PY
      - name: Archive candidate patch and visible test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p14-matplotlib-second-visible
          path: p14_second/
          retention-days: 60
          if-no-files-found: warn
