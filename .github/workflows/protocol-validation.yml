name: Repair protocol software tests and frozen-source audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol-validation.yml'
      - 'README.md'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - 'data/**'
      - 'protocol/**'
  pull_request:
    paths:
      - '.github/workflows/protocol-validation.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coding-repair-synthetic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-software-validation:
    name: Unit tests and synthetic decision sealing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout this commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Report interpreter and Docker availability
        shell: bash
        run: |
          python3 --version
          docker version --format 'Docker client {{.Client.Version}} / server {{.Server.Version}}'
      - name: Run software-only unit and negative-case tests
        run: python3 -m unittest discover -s tests -v
      - name: Demonstrate pre-oracle seal and synthetic reveal
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/p9_decide.py \
            --input examples/SYNTHETIC_decision_only.jsonl \
            --out "$RUNNER_TEMP/repair-decision-seal"
          python3 scripts/p9_reveal.py \
            --sealed-dir "$RUNNER_TEMP/repair-decision-seal" \
            --oracle examples/SYNTHETIC_oracle_AFTER_SEAL.jsonl \
            --out "$RUNNER_TEMP/synthetic-score.json"
          python3 - "$RUNNER_TEMP/synthetic-score.json" <<'PYVERIFY'
          import json, sys
          with open(sys.argv[1],encoding='utf-8') as f:
              result=json.load(f)
          assert result['total_decisions']==2
          assert result['oracle_admitted']==2
          assert result['oracle_pass']==1 and result['oracle_fail']==1
          assert result['policies']['self_report']['false_accept']==1
          assert result['policies']['source_linked']['false_accept']==0
          print('PASS: synthetic software fixture only; no independent task-oracle execution')
          PYVERIFY

      - name: Recompute real P10 source coverage without oracle labels
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_p10_source.py --output "$RUNNER_TEMP/P10_SOURCE_AUDIT.json"
      - name: Preserve machine-readable source audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frozen-source-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/P10_SOURCE_AUDIT.json
          if-no-files-found: warn
          retention-days: 30
